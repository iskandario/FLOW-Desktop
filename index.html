<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161922"><title>FLOW Pocket</title><link rel="stylesheet" href="./style.css"><script defer src="https://telegram.org/js/telegram-web-app.js"></script></head><body><main>
<header><strong>FLOW<span>●</span></strong><small>POCKET MIXER</small></header>
<section class="stage"><div class="decks"><article><small>ДЕКА A</small><h2 id="deckA">—</h2></article><article><small>ДЕКА B</small><h2 id="deckB">—</h2></article></div><canvas id="scope" width="600" height="96"></canvas><div class="transport"><b id="tempo">— BPM</b><span id="clock">00:00</span></div></section>
<nav aria-label="Режим"><button id="mix" aria-pressed="false">Автомикс</button><button id="mash" aria-pressed="true">Мэшап</button></nav>
<button id="play" class="play">▶ Запустить сет</button><p id="status" role="status">Три демотрека готовы. Можно добавить свою музыку.</p>
<section><div class="heading"><h1>Очередь</h1><label class="add">＋ Треки<input type="file" id="files" accept="audio/*" multiple></label></div><ol id="queue"></ol></section>
<section id="macPanel" hidden><h2>Библиотека VK</h2><button id="pair">Подключить FLOW на Mac</button><div id="connected" hidden><button id="login">Вход VK</button> <button id="library">Мои треки</button> <button id="autoVK" hidden>▶ Автосет из VK</button><div id="catalog"></div><button id="more" hidden>Ещё треки</button>
<h2>Светомузыка</h2><input type="password" id="lightToken" autocomplete="off" placeholder="Токен локального Home Assistant"><button id="lamps">Найти лампу</button><select id="lamp" aria-label="Лампа"></select><label><input type="checkbox" id="lightOn" disabled>Свет на ударах сета</label></div><p role="status" id="bridgeStatus"></p></section>
<details><summary>Мобильный VK ID</summary><div id="vk"></div></details>
</main><script type="module" src="./app.js"></script></body></html>
